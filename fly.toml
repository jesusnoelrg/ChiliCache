# fly.toml app configuration file generated for chilicache on 2026-08-03T07:59:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chilicache'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/var/data'
  MODE = 'production'
  NODE_ENV = 'production'

[[mounts]]
  source = 'chilicache_data'
  destination = '/var/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
