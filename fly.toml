# fly.toml — https://fly.io/docs/reference/configuration/

app = 'chilicache'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  MODE = 'production'
  NODE_ENV = 'production'
  DATA_DIR = '/var/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'chilicache_data'
  destination = '/var/data'
